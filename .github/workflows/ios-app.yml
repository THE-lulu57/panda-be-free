name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version

      - name: Prepare Signing Config
        run: |
          mkdir -p Configuration
          cp Configuration/LocalSigning.xcconfig.example Configuration/LocalSigning.xcconfig 2>/dev/null || true
          echo "DEVELOPMENT_TEAM =" >> Configuration/LocalSigning.xcconfig
          echo "PRODUCT_BUNDLE_IDENTIFIER = com.miguelschulz.PandaBeFree" >> Configuration/LocalSigning.xcconfig

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project PandaBeFree.xcodeproj \
            -scheme PandaBeFree \
            -configuration Release \
            -archivePath build/PandaBeFree.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PandaBeFree.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r PandaBeFree.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaBeFree-IPA
          path: build/PandaBeFree.ipa
